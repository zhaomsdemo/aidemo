spring:
  application:
    name: aidemo

  ai:
    ollama:
      init:
        pull-model-strategy: when_missing
        chat:
          additional-models:
            - llama3.2
      chat:
        options:
          temperature: 0.7
          stream: true

logging:
  level:
    org.zalando.logbook: TRACE

logbook:
  format:
    style: http